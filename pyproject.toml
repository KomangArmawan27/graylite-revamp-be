[project]
name = "erp-api"
version = "0.1.0"
description = "FastAPI service exposing SQL Server ERP to Flutter app"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "pyodbc",
  "pydantic>=2",
  "pydantic-settings",
  "PyJWT[crypto]",
  "argon2-cffi",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require SQL Server (deselect with '-m \"not integration\"')",
]
